    status: exempt
    comment: Nothing can be discovered.
  discovery:
    status: exempt
    comment: Nothing can be discovered.
  docs-data-update: todo
  docs-examples: todo
  docs-known-limitations: done
  docs-supported-devices:
    status: exempt
