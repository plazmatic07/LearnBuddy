  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow:
    status: exempt
    comment: The main entry has no data; subentries can be reconfigured.
  repair-issues: done
  stale-devices: done

  # Platinum
  async-dependency:
    status: exempt
    comment: The integration has no dependencies.
  inject-websession:
    status: exempt
