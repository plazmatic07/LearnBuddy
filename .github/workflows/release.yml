name: Release

# Creates the GitHub release for a version tag. The notes come from
# release-notes/<version>.md, which is committed before the tag is pushed.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to create or update the release for, e.g. v0.9.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="${TAG#v}"
          manifest=$(python3 -c "import json; print(json.load(open('custom_components/learnbuddy/manifest.json'))['version'])")
          if [ "$manifest" != "$version" ]; then
            echo "::error::Tag $TAG does not match the manifest version $manifest"
            exit 1
          fi
          notes="release-notes/${version}.md"
          if [ ! -s "$notes" ]; then
            echo "::error::Missing release notes: $notes"
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file "$notes"
          else
            gh release create "$TAG" --title "$TAG" --notes-file "$notes" --verify-tag
          fi
